<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Página não encontrada | Bruno Faustino</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;700&family=Playfair+Display:ital,wght@0,800;1,700&display=swap" rel="stylesheet" />
    <style>
      :root { --ink:#171411; --paper:#f2ecdf; --gold:#d7a54d; }
      * { box-sizing:border-box; }
      body { margin:0; min-height:100vh; display:grid; place-items:center; text-align:center;
             background:var(--ink); color:var(--paper); font-family:"DM Sans",sans-serif; padding:32px; }
      .brand { font-family:"Playfair Display",serif; font-weight:800; font-size:2rem; letter-spacing:-.1em; }
      .brand span { color:var(--gold); }
      h1 { font-family:"Playfair Display",serif; font-weight:800; font-size:clamp(3rem,10vw,6rem);
           letter-spacing:-.055em; line-height:.9; margin:28px 0 12px; }
      h1 em { color:var(--gold); }
      p { margin:0 0 6px; opacity:.8; line-height:1.6; }
      p.es { opacity:.5; font-size:.9rem; }
      a.back { display:inline-block; margin-top:32px; background:var(--gold); color:var(--ink);
               padding:16px 24px; font-size:.72rem; font-weight:700; text-transform:uppercase;
               letter-spacing:.1em; text-decoration:none; }
    </style>
  </head>
  <body>
    <main>
      <div class="brand">BF<span>.</span></div>
      <h1>4<em>0</em>4</h1>
      <p>Essa página não existe. Mas o show continua.</p>
      <p class="es">Esta página no existe. Pero el show sigue.</p>
      <a class="back" href="/">Voltar ao início / Volver al inicio</a>
    </main>
  </body>
</html>
